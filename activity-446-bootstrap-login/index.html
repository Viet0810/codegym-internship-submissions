<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bootstrap Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container min-vh-100 d-flex align-items-center justify-content-center"><form class="card p-4 shadow-sm" style="max-width:420px;width:100%"><h1 class="h3 text-center mb-4">Đăng nhập</h1><label class="form-label">Email</label><input type="email" class="form-control mb-3" required><label class="form-label">Mật khẩu</label><input type="password" class="form-control mb-3" required><div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label></div><button class="btn btn-primary w-100">Đăng nhập</button></form></main></body></html>
